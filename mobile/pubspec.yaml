name: scalesquad_mobile
description: ScaleSquad Android development client.
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.13.1
  flutter: '>=3.47.1'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
    - assets/icons/
    - assets/licenses/
  fonts:
    - family: Chivo
      fonts:
        - asset: assets/fonts/chivo.ttf
    - family: Bungee
      fonts:
        - asset: assets/fonts/bungee.ttf
